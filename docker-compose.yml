services:
  app:
    image: research-booking-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-booking-app
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3307/research_booking_system
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Faculty Login — PaperLab Research Booking System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1200bc",
                        "primary-container": "#1d00ff",
                        "ink-deep": "#1600b8",
                        "surface": "#fcfae8",
                        "surface-container": "#f0efdd",
                        "surface-container-low": "#f6f4e2",
                        "surface-container-high": "#ebe9d7",
                        "surface-variant": "#e5e3d2",
                        "paper-pure": "#ffffff",
                        "secondary": "#626200",
                        "secondary-container": "#e9e94d",
                        "electric-cyan": "#7df5ff",
                        "soft-blush": "#ffe6f2",
                        "on-surface": "#1c1c12",
                        "on-surface-variant": "#454558",
                        "on-primary": "#ffffff",
                        "status-confirmed": "#4ade80",
                        "status-pending": "#f59e0b",
                        "status-rejected": "#ef4444"
                    },
                    fontFamily: {
                        "headline": ["EB Garamond", "serif"],
                        "body": ["Space Grotesk", "sans-serif"],
                        "mono": ["Space Mono", "monospace"]
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" th:href="@{/css/portal.css}"/>
</head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Paper Card Container -->
    <div class="relative w-full max-w-md bg-paper-pure rounded-xl p-8 border-2 border-primary shadow-[6px_6px_0px_#1d00ff]">
        <!-- Washi Tape Pin -->
        <div class="absolute -top-3.5 left-1/2 -translate-x-1/2 px-4 py-0.5 bg-secondary-container border-2 border-primary font-mono text-xs uppercase font-bold text-primary rounded-full shadow-[2px_2px_0px_#1d00ff] -rotate-1 select-none">
            FACULTY ACCESS &bull; FORM 101
        </div>

        <!-- Header -->
        <div class="text-center mb-6 pt-2">
            <div class="w-12 h-12 rounded-full bg-paper-pure border-2 border-primary shadow-[2px_2px_0px_#1d00ff] flex items-center justify-center mx-auto mb-3 -rotate-2">
                <span class="text-2xl">👨‍🏫</span>
            </div>
            <h1 class="font-headline text-3xl font-bold italic text-primary leading-tight m-0">Teacher Login</h1>
            <p class="font-mono text-xs text-on-surface-variant uppercase font-bold mt-1 m-0">Access the laboratory experiment management portal</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${param.error}" class="mb-4 p-3 rounded-lg border-2 border-primary bg-red-100 text-red-800 font-mono text-xs uppercase font-bold shadow-[2px_2px_0px_#1d00ff] text-center">
            Invalid email or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="mb-4 p-3 rounded-lg border-2 border-primary bg-secondary-container text-primary font-mono text-xs uppercase font-bold shadow-[2px_2px_0px_#1d00ff] text-center">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block font-mono text-xs uppercase font-bold text-on-surface-variant mb-1">Email Address</label>
                <input type="email" id="username" name="username" class="w-full px-4 py-2.5 bg-surface-container-low rounded-full border-2 border-primary font-body text-sm text-primary focus:outline-none focus:bg-paper-pure shadow-[2px_2px_0px_#1d00ff]" placeholder="teacher@example.com" required autofocus autocomplete="email"/>
            </div>
            <div>
                <label for="password" class="block font-mono text-xs uppercase font-bold text-on-surface-variant mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2.5 bg-surface-container-low rounded-full border-2 border-primary font-body text-sm text-primary focus:outline-none focus:bg-paper-pure shadow-[2px_2px_0px_#1d00ff]" placeholder="Enter your password" required autocomplete="current-password"/>
            </div>
            <button type="submit" class="w-full py-3 rounded-full bg-secondary-container text-primary font-mono text-xs uppercase font-bold border-2 border-primary shadow-[3px_3px_0px_#1d00ff] hover:-translate-y-0.5 active:translate-y-0 transition-transform cursor-pointer">
                Sign In
            </button>
        </form>

        <div class="mt-6 pt-4 border-t-2 border-primary/20 text-center font-mono text-xs">
            <a th:href="@{/login}" class="text-primary font-bold hover:underline">← Back to Participant Sign In</a>
        </div>
    </div>

</body>
</html>

# -------------------------------------------------------
# Test datasource: H2 in-memory (no MySQL required)
# -------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from the entity mappings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Suppress H2 console and banner noise
spring.h2.console.enabled=false

# Keep the same port so WebMvcTest context beans resolve correctly
server.port=8081
